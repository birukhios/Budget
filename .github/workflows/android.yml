name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      appHost:
        description: 'Host of your deployed PWA (no scheme), e.g. birr.example.com'
        required: true
        default: 'example.com'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: the runner image already ships the Android SDK,
      # and installing a second copy is what broke the earlier runs.
      - name: Show SDK location
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug \
            -PappHost="${{ github.event.inputs.appHost || vars.APP_HOST || 'example.com' }}" \
            --no-daemon --stacktrace

      # The TWA only drops the URL bar when this fingerprint is published at
      # https://<your-host>/.well-known/assetlinks.json — the server serves it
      # from the TWA_FINGERPRINT env var.
      - name: Print signing fingerprint for assetlinks.json
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            | grep -A1 'SHA256:' | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: birr-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
